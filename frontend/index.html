<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Cloud Salon — Premium Multi-Tenant Salon SaaS | Cloud Technologies</title>
    
    <!-- PWA Web Manifest & Theme Configuration -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#12141A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cloud Salon" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />

    <!-- Google Fonts for luxury typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  </head>
  <body class="bg-salon-ivory text-salon-charcoal antialiased selection:bg-salon-gold/20 selection:text-salon-gold-dark">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('Cloud Salon PWA Service Worker registered:', reg.scope),
            (err) => console.log('Cloud Salon Service Worker registration failed:', err)
          );
        });
      }
    </script>
  </body>
</html>
